[package]
name = "chunked-uploader"
version = "0.1.1"
edition = "2021"
description = "A resumable chunked upload server supporting large files (>10GB) with Cloudflare compatibility"
license = "MIT"

[features]
default = []
smb = ["dep:smb"]
s3 = ["aws-config", "aws-sdk-s3", "aws-credential-types", "aws-smithy-runtime"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# JWT & Crypto
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"

# SMB storage (optional - pure Rust implementation, no C dependencies)
smb = { version = "0.11", optional = true }

# S3 storage (optional - requires native crypto libs)
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-smithy-runtime = { version = "1", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config & Utils
dotenvy = "0.15"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utils
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
bytes = "1"

# HTTP client for webhooks
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
